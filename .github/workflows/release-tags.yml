name: release-tags

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: COMMIT
          failOnError: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      # kd compares versions as vX.Y.Z (older clients included), and the tag
      # becomes the version every release binary reports.
      - name: Check the tag
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          }

      - name: Build all targets
        env:
          KD_VERSION: ${{ github.ref_name }}
        run: bash scripts/build.sh --all

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          fail_on_unmatched_files: true
          prerelease: false
          files: build/*
